$kind: http-request
name: Login (Donor)
order: 1010
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "email": "{{donorEmail}}", "password": "{{donorPassword}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Donor login succeeded', () => pm.response.to.have.status(200));
      const res = pm.response.json();
      if (res.token && res.user?.role === 'DONOR') pm.collectionVariables.set('donorToken', res.token);
      pm.test('Logged-in account is a donor', () => pm.expect(res.user.role).to.eql('DONOR'));
