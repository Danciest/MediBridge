$kind: http-request
name: Platform Statistics
order: 1400
method: GET
url: '{{baseUrl}}/admin/statistics'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Statistics are available to admins', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.users).to.have.property('total');
      pm.expect(body.medicines).to.have.property('availableQuantity');
      pm.expect(body.rewards).to.have.property('awarded');
