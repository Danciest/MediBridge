$kind: http-request
name: Rewards - Transactions
order: 1500
method: GET
url: '{{baseUrl}}/admin/rewards?page=1&limit=20'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin can review reward activity', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().transactions).to.be.an('array');
