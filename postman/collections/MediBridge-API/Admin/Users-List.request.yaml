$kind: http-request
name: Users - List/Search
order: 1100
method: GET
url: '{{baseUrl}}/admin/users?page=1&limit=20&search={{search}}&role={{role}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin can list users', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.users).to.be.an('array');
      pm.expect(body.users[0] || {}).not.to.have.property('password');
      if (body.users[0]) pm.collectionVariables.set('userId', body.users[0]._id);
