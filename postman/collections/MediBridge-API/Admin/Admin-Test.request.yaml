$kind: http-request
name: Admin Test
order: 1000
method: GET
url: '{{baseUrl}}/admin-test'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Authorized as ADMIN', () => {
          const body = pm.response.json();
          pm.expect(body.user.role).to.eql('ADMIN');
      });
