$kind: http-request
name: Donations - List/Filter
order: 1200
method: GET
url: '{{baseUrl}}/admin/medicines?page=1&limit=20&verificationStatus=PENDING'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin can list donations', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.medicines).to.be.an('array');
      if (body.medicines[0]) pm.collectionVariables.set('medicineId', body.medicines[0]._id);
