$kind: http-request
name: Users - Details
order: 1110
method: GET
url: '{{baseUrl}}/admin/users/{{userId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin can view a user without secrets', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.user).not.to.have.property('password');
      pm.expect(body.activity).to.be.an('object');
